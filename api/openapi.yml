  /api/auth/session: {"servers":[{"url":"http://localhost:8003"}],"get":{"tags":["BFF Authentication"],"operationId":"bffSessionInfo","security":[{"bffSession":[]}],"responses":{"200":{"description":"Authenticated result","content":{"application/json":{"schema":{"type":"object","required":["username","role"],"properties":{"username":{"type":"string"},"role":{"type":"string","enum":["ops","ingest","readonly"]}}}}}},"401":{"description":"Invalid credentials or revoked/expired session"},"403":{"description":"Origin check failed"},"503":{"description":"Account database unavailable (fail closed); password login unavailable in OIDC mode"}}}}
  /api/auth/logout: {"servers":[{"url":"http://localhost:8003"}],"post":{"tags":["BFF Authentication"],"operationId":"bffLogout","security":[{"bffSession":[]}],"parameters":[{"name":"Origin","in":"header","required":true,"schema":{"type":"string"}}],"responses":{"204":{"description":"Session revoked; cookie cleared"},"401":{"description":"Invalid credentials or revoked/expired session"},"403":{"description":"Origin check failed"},"503":{"description":"Account database unavailable (fail closed); password login unavailable in OIDC mode"}}}}
  /api/auth/role: {"servers":[{"url":"http://localhost:8003"}],"post":{"tags":["BFF Authentication"],"operationId":"bffSessionRoleChange","description":"Any different role revokes the session. This endpoint does not change the DB account role; use the host account-admin CLI.","security":[{"bffSession":[]}],"parameters":[{"name":"Origin","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["role"],"properties":{"role":{"type":"string","enum":["ops","ingest","readonly"]}}}}}},"responses":{"200":{"description":"Whether session was terminated","content":{"application/json":{"schema":{"type":"object","required":["role","session_terminated"],"properties":{"role":{"type":"string","enum":["ops","ingest","readonly"]},"session_terminated":{"type":"boolean"}}}}}},"401":{"description":"Invalid credentials or revoked/expired session"},"403":{"description":"Origin check failed"},"422":{"description":"Invalid role"},"503":{"description":"Account database unavailable (fail closed); password login unavailable in OIDC mode"}}}}
  /health: {"servers":[{"url":"http://simulator:9000","description":"Docker-internal only; no host mapping"},{"url":"http://kc-modbus-sim:9000","description":"Docker-internal only; no host mapping"},{"url":"http://kc-mqtt-sim:9000","description":"Docker-internal only; no host mapping"},{"url":"http://delta-simulator:9000","description":"Docker-internal only; no host mapping"}],"get":{"tags":["Internal Simulator Control"],"operationId":"internalSimulatorHealth","responses":{"200":{"description":"Internal typed control result","content":{"application/json":{"schema":{"type":"object","required":["status","control_configured","control_faulted"],"properties":{"status":{"const":"ok"},"control_configured":{"type":"boolean"},"control_faulted":{"type":"boolean"}}}}}}}}}
  /state: {"servers":[{"url":"http://simulator:9000","description":"Docker-internal only; no host mapping"},{"url":"http://kc-modbus-sim:9000","description":"Docker-internal only; no host mapping"},{"url":"http://kc-mqtt-sim:9000","description":"Docker-internal only; no host mapping"},{"url":"http://delta-simulator:9000","description":"Docker-internal only; no host mapping"}],"get":{"tags":["Internal Simulator Control"],"security":[{"simControlToken":[]}],"operationId":"internalSimulatorState","responses":{"200":{"description":"Internal typed control result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SimulatorSnapshot"}}}},"401":{"description":"Bad credential"},"503":{"description":"Control not configured"}}}}
  /receipts/{request_id}: {"servers":[{"url":"http://simulator:9000","description":"Docker-internal only; no host mapping"},{"url":"http://kc-modbus-sim:9000","description":"Docker-internal only; no host mapping"},{"url":"http://kc-mqtt-sim:9000","description":"Docker-internal only; no host mapping"},{"url":"http://delta-simulator:9000","description":"Docker-internal only; no host mapping"}],"parameters":[{"name":"request_id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"get":{"tags":["Internal Simulator Control"],"security":[{"simControlToken":[]}],"operationId":"internalSimulatorReceipt","responses":{"200":{"description":"Internal typed control result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SimulatorReceipt"}}}},"401":{"description":"Bad credential"},"404":{"description":"No receipt; not evidence of non-execution"},"503":{"description":"Control not configured"}}}}
  /apply: {"servers":[{"url":"http://simulator:9000","description":"Docker-internal only; no host mapping"},{"url":"http://kc-modbus-sim:9000","description":"Docker-internal only; no host mapping"},{"url":"http://kc-mqtt-sim:9000","description":"Docker-internal only; no host mapping"},{"url":"http://delta-simulator:9000","description":"Docker-internal only; no host mapping"}],"post":{"tags":["Internal Simulator Control"],"security":[{"simControlToken":[]}],"operationId":"internalSimulatorApply","description":"Internal only. Body <=4096 bytes. CAS, apply, revision and receipt run atomically on a single event-loop thread. Deadline is epoch seconds between now and now+15s. BFF sends now+10s; no automatic retries. Queries forbidden.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SimulatorApply"}}}},"responses":{"200":{"description":"Internal typed control result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/SimulatorReceipt"}}}},"401":{"description":"Bad credential"},"409":{"description":"UUID, instance or revision conflict"},"410":{"description":"Expired or invalid deadline"},"413":{"description":"Body too large"},"422":{"description":"Invalid body/changes/query"},"429":{"description":"Receipt capacity exhausted; no application"},"503":{"description":"Not configured, faulted or application outcome unknown"}}}}
  /api/alarms/demo:
    servers: [{url: 'http://localhost:8003'}]
    get:
      tags: [BFF Demo Alarms]
      summary: Telegram 示範通知設定狀態、最近十筆成功紀錄與展位 QR 綁定狀態
      operationId: getDemoAlarmStatus
      description: |
        OPS session required. No query parameters. No external send. In-memory recent records
        clear on BFF restart. `binding` (PRD-0024) is null when booth binding is disabled; the
        deep link carries a rotating start code (new every 60 s, each valid 300 s) and is only
        present while the Telegram poller is ready. The UI polls this endpoint (~4 s).
      security: [{bffSession: []}]
      responses:
        '200':
          description: Notification readiness, recent acknowledgements and booth binding state
          content:
            application/json:
              schema:
                type: object
                required: [configured, cooldown_seconds, recent, binding]
                properties:
                  configured: {type: boolean}
                  cooldown_seconds: {type: integer, minimum: 0}
                  recent:
                    type: array
                    maxItems: 10
                    items: {$ref: '#/components/schemas/DemoAlarmDelivery'}
                  binding:
                    oneOf:
                      - {$ref: '#/components/schemas/DemoAlarmBinding'}
                      - {type: 'null'}
        '401': {description: Session absent or expired}
        '403': {description: OPS role required}
        '422': {description: Query parameters are not supported}
    post:
      tags: [BFF Demo Alarms]
      summary: 發送 Telegram 示範警報（有效展位綁定訪客優先，否則固定對象）
      operationId: triggerDemoAlarm
      description: |
        OPS session and allowlisted Origin required. No query parameters.
        Recipient is chosen server-side (PRD-0024): a valid booth binding receives only the fixed
        3-line visitor text with today's visitor number (Asia/Taipei); otherwise the fixed chat
        receives the original DEMO message (not counted). The request cannot name a recipient or text.
        Numbers are kept for acknowledged or uncertain (timeout) sends, released on definite failure.
        Server-side fixed bot and message templates; no device control.
        Global 30-second default cooldown. Same UUID is deduplicated for 10 minutes
        including failures (64-entry cap); no automatic retry. Single-process,
        in-memory state resets on restart. Success means Telegram accepted, not read.
      security: [{bffSession: []}]
      parameters:
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id]
              properties:
                request_id:
                  type: string
                  format: uuid
                  description: UUID version 4; reuse only for the same logical send attempt
      responses:
        '200':
          description: Confirmed Telegram acknowledgement or replay of the same successful UUID
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DemoAlarmDelivery'}
                  - type: object
                    required: [cooldown_seconds]
                    properties:
                      cooldown_seconds: {type: integer, minimum: 0}
        '401': {description: Session absent or expired}
        '403': {description: OPS role or Origin check failed}
        '409': {description: Same UUID is still in progress (demo_alarm_in_progress)}
        '422': {description: Invalid UUID4 or unsupported fields/query}
        '429':
          description: Global cooldown or bounded dedupe cache is full (demo_alarm_cooldown)
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
              description: Seconds before a new attempt is permitted
        '502':
          description: telegram_delivery_failed or telegram_delivery_unknown; no automatic resend
        '503': {description: Telegram credentials missing (telegram_not_configured)}
  /api/devices/{device_id}/history:
    servers: [{url: 'http://localhost:8003'}]
    get:
      tags: [BFF History]
      summary: 完整指定區間的設備趨勢彙整
      operationId: getDeviceHistory
      description: |
        OPS session required. Read-only and idempotent; retries safe.
        Half-open [since, until), timezone required, maximum 7 days.
        Unknown/repeated query parameters return 422. No new rate limiter.
        Server resolves domain through gateway_id and calls internal read-only
        api.measurement_history RPC (migration 017); never accepts browser SQL.
        Numeric value is mean; last is bucket-end sample. Boolean signals encode
        0/1; min != max means transitions within the bucket, not an exact timeline.
        Empty buckets/signals are omitted; missing data must not be filled with zero.
      security: [{bffSession: []}]
      parameters:
        - {$ref: '#/components/parameters/HistoryDeviceId'}
        - {$ref: '#/components/parameters/HistorySince'}
        - {$ref: '#/components/parameters/HistoryUntil'}
        - name: points
          in: query
          schema: {type: integer, minimum: 60, maximum: 1200, default: 600}
      responses:
        '200':
          description: Bounded bucket series for the entire requested interval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceHistory'}
        '401': {description: Session absent or expired}
        '403': {description: OPS role required}
        '404': {description: Device or measurement domain missing}
        '422': {description: Invalid range or parameters}
        '502': {description: Upstream unavailable}
        '503': {description: OPS channel not configured}
  /api/devices/{device_id}/records:
    servers: [{url: 'http://localhost:8003'}]
    get:
      tags: [BFF History]
      summary: 查詢指定區間的原始量測紀錄
      operationId: getDeviceRecords
      description: |
        OPS-only, read-only, idempotent; same 7-day timezone-aware half-open range.
        Ordered by time descending and full row JSON as deterministic tie-break.
        Returns a fixed-time-window page, not a transaction snapshot; late arrivals
        may shift offsets. limit+1 lookahead determines has_more. Existing samples
        are unmodified; fields may be null for sparse factory rows.
        Internal RPC api.measurement_records, via BFF only for browser clients.
      security: [{bffSession: []}]
      parameters:
        - {$ref: '#/components/parameters/HistoryDeviceId'}
        - {$ref: '#/components/parameters/HistorySince'}
        - {$ref: '#/components/parameters/HistoryUntil'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        '200':
          description: Raw page; no total count
          content:
            application/json:
              schema:
                type: object
                required: [rows, has_more]
                properties:
                  has_more: {type: boolean}
                  rows:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      required: [time, device_id]
                      properties:
                        time: {type: string, format: date-time}
                        device_id: {type: string}
                      additionalProperties: true
        '401': {description: Session absent or expired}
        '403': {description: OPS role required}
        '404': {description: Device or measurement domain missing}
        '422': {description: Invalid range or pagination}
        '502': {description: Upstream unavailable}
        '503': {description: OPS channel not configured}

  /api/simulators:
    servers: [{url: 'http://localhost:8003'}]
    get:
      tags: [Simulator Control]
      operationId: listSimulators
      summary: OPS 查詢四個固定 simulator 的狀態與可設定欄位
      description: No query parameters. Settings are control state, not telemetry. Unreachable targets return available=false.
      security: [{bffSession: []}]
      responses:
        '200':
          description: Fixed simulator registry
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SimulatorDescription'}}
        '401': {description: Login required}
        '403': {description: OPS required}
        '422': {description: Query parameters forbidden}
        '503': {description: Control or audit unavailable}
  /api/simulators/{simulator_id}:
    servers: [{url: 'http://localhost:8003'}]
    parameters:
      - {$ref: '#/components/parameters/SimulatorId'}
    get:
      tags: [Simulator Control]
      operationId: getSimulatorState
      summary: OPS 查詢控制設定、instance 與 revision
      security: [{bffSession: []}]
      responses:
        '200':
          description: Control configuration and capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulatorDescription'}
        '401': {description: Login required}
        '403': {description: OPS required}
        '422': {description: Invalid ID or query}
        '503': {description: Control or audit unavailable}
  /api/simulators/{simulator_id}/commands:
    servers: [{url: 'http://localhost:8003'}]
    parameters:
      - {$ref: '#/components/parameters/SimulatorId'}
    post:
      tags: [Simulator Control]
      operationId: configureSimulator
      summary: 統一設定 simulator 並先持久化操作紀錄
      description: |
        OPS session plus allowlisted Origin required. No query parameters; body <=4096 bytes.
        Changes schema must match path ID. No host/register/topic/process operations.
        Actor comes from session. UUID dedup persists across restarts; changed actor/body conflicts.
        Succeeded means settings applied, not telemetry delivered. Timeout/crash remains
        outcome_unknown, blocks this target and is never automatically resent.
        Before/after are configuration snapshots. Targets reset settings on restart.
      security: [{bffSession: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulatorCommand'}
      responses:
        '200':
          description: Durable succeeded, failed, or outcome_unknown operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulatorOperation'}
        '202':
          description: Same UUID is still pending; it was not dispatched twice
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulatorOperation'}
        '401': {description: Login required}
        '403': {description: OPS or exact Origin required}
        '409': {description: UUID conflict, target busy, or unresolved earlier command}
        '413': {description: Body exceeds 4096 bytes}
        '422': {description: Invalid ID, schema, changes, or query}
        '503': {description: Disabled, audit unavailable, or audit capacity reached; success not confirmed}
  /api/simulators/operations:
    servers: [{url: 'http://localhost:8003'}]
    get:
      tags: [Simulator Control]
      operationId: listSimulatorOperations
      summary: OPS 查詢持久操作紀錄，依 sequence 倒序
      security: [{bffSession: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: before, in: query, schema: {type: integer, minimum: 1}}
        - {name: simulator_id, in: query, schema: {$ref: '#/components/schemas/SimulatorIdValue'}}
      responses:
        '200':
          description: Bounded page; next_before is the last sequence or null
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/SimulatorOperation'}}
                  next_before: {type: [integer, 'null']}
        '401': {description: Login required}
        '403': {description: OPS required}
        '422': {description: Invalid or unknown query}
        '503': {description: Audit unavailable}
  /api/simulators/operations/{request_id}:
    servers: [{url: 'http://localhost:8003'}]
    parameters:
      - {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Simulator Control]
      operationId: getSimulatorOperation
      summary: OPS 依 UUID 查操作與歷次結果事件
      security: [{bffSession: []}]
      responses:
        '200':
          description: Durable operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulatorOperation'}
        '401': {description: Login required}
        '403': {description: OPS required}
        '404': {description: Operation not found}
        '422': {description: Invalid UUID or query}
        '503': {description: Audit unavailable}
  /api/simulators/operations/{request_id}/reconcile:
    servers: [{url: 'http://localhost:8003'}]
    parameters:
      - {name: request_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Simulator Control]
      operationId: reconcileSimulatorOperation
      summary: 查原始 receipt 對帳，或確認 target 已換 instance 後解封
      description: |
        OPS plus Origin. No query; body <=4096 bytes. Never resends a command.
        Receipt must match UUID, command hash, target, old instance, revision and snapshots.
        Missing receipt/current matching settings do not prove success.
        A new authoritative instance retires the old instance in this single-container topology;
        status stays outcome_unknown, resolved=true permits further commands.
        Unchanged/unavailable evidence returns the original unresolved record.
      security: [{bffSession: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
      responses:
        '200':
          description: Current operation including any appended reconciliation event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulatorOperation'}
        '401': {description: Login required}
        '403': {description: OPS or Origin required}
        '404': {description: Operation not found}
        '409': {description: Target command still running}
        '413': {description: Body too large}
        '422': {description: Invalid body, UUID, or query}
        '503': {description: Audit unavailable}

  # ============================================================
  # Query API - PostgREST (port 3001)
  # ============================================================
  /electricity_measurements:
    get:
      tags:
        - Query
      summary: 查詢歷史電力量測資料
      description: |
        使用 PostgREST 語法查詢 TimescaleDB 中的歷史電力量測資料（electricity_measurements 表）。

        **支援的運算子：**
        - `eq.` 等於
        - `gt.` 大於
        - `gte.` 大於等於
        - `lt.` 小於
        - `lte.` 小於等於
        - `neq.` 不等於

        **範例：**
        - `?power_kw=gt.50` - 功率大於 50kW
        - `?time=gte.2026-04-23T00:00:00` - 時間大於等於指定時間
      operationId: getMeasurements
      servers:
        - url: http://localhost:3001
      parameters:
        - name: select
          in: query
          description: 選擇要回傳的欄位 (逗號分隔)
          schema:
            type: string
          example: time,power_kw,voltage
        - name: device_id
          in: query
          description: 依設備 ID 過濾 (使用 eq.xxx 格式)
          schema:
            type: string
          example: eq.sim-001
        - name: time
          in: query
          description: 依時間過濾 (使用 gte.xxx 或 lte.xxx 格式)
          schema:
            type: string
          example: gte.2026-04-23T00:00:00
        - name: power_kw
          in: query
          description: 依功率過濾 (使用 gt.xxx, lt.xxx 等格式)
          schema:
            type: string
          example: gt.50
        - name: voltage
          in: query
          description: 依電壓過濾
          schema:
            type: string
        - name: current
          in: query
          description: 依電流過濾
          schema:
            type: string
        - name: order
          in: query
          description: 排序欄位 (欄位名.asc 或 欄位名.desc)
          schema:
            type: string
            default: time.desc
          example: time.desc
        - name: limit
          in: query
          description: 限制回傳筆數
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
          example: 10
        - name: offset
          in: query
          description: 跳過前 N 筆
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        '200':
          description: 量測資料列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Measurement'
              example:
                - time: "2026-04-23T10:30:00Z"
                  device_id: sim-001
                  voltage: 381.2
                  current: 105.3
                  power_kw: 58.7
                  energy_kwh: 1234.56
        '400':
          description: 查詢參數錯誤


  /factory_measurements:
    get:
      tags:
        - Query
      summary: 查詢工廠量測資料
      description: |
        使用 PostgREST 語法查詢 TimescaleDB 中的工廠 PLC 與 JSON 感測器資料（factory_measurements 表）。

        **來源設備：**
        - `plc-001`: KC Modbus PLC simulator，包含 temperature、humidity、motor_speed、pump_on、valve_open、pressure
        - `sensor-001`: KC MQTT JSON sensor，包含 temperature、humidity
      operationId: getFactoryMeasurements
      servers:
        - url: http://localhost:3001
      parameters:
        - name: select
          in: query
          description: 選擇要回傳的欄位 (逗號分隔)
          schema:
            type: string
          example: time,device_id,temperature,humidity,pressure
        - name: device_id
          in: query
          description: 依設備 ID 過濾 (使用 eq.xxx 格式)
          schema:
            type: string
          example: eq.plc-001
        - name: device_type
          in: query
          description: 依設備類型過濾 (plc 或 sensor)
          schema:
            type: string
          example: eq.plc
        - name: time
          in: query
          description: 依時間過濾 (使用 gte.xxx 或 lte.xxx 格式)
          schema:
            type: string
          example: gte.2026-04-27T00:00:00
        - name: order
          in: query
          description: 排序欄位 (欄位名.asc 或 欄位名.desc)
          schema:
            type: string
            default: time.desc
          example: time.desc
        - name: limit
          in: query
          description: 限制回傳筆數
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 100
          example: 10
      responses:
        '200':
          description: 工廠量測資料列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FactoryMeasurement'
              example:
                - time: "2026-04-27T09:00:00Z"
                  device_id: plc-001
                  device_type: plc
                  temperature: 25.3
                  humidity: 55.2
                  motor_speed: 1500
                  pump_on: true
                  valve_open: false
                  pressure: 1013
        '400':
          description: 查詢參數錯誤

  # ============================================================
