  # ============================================================
  # Device Service API (port 8002, PRD-0003) — Registry + 自動分類
  # 認證：X-API-Key（OPS / INGEST / AI 三通道，FR-310）。
  # 內容違規回 400（§7.3a），凍結紀錄非經 lifecycle endpoint 回 409。
  # 注意：MCP 端點（127.0.0.1:8766）走 MCP Streamable-HTTP 協定，非 REST，不在本 OpenAPI；
  #       見 doc/operations/容器速查表 2-14。
  # ============================================================
  /healthz:
    get:
      tags: [Device Service]
      summary: device-service 健康檢查（雙 pool 狀態，FR-314）
      operationId: deviceHealthz
      responses:
        '200': { description: 所有 pool ok, content: { application/json: { schema: { $ref: '#/components/schemas/HealthOut' } } } }
        '503': { description: 至少一個 pool degraded, content: { application/json: { schema: { $ref: '#/components/schemas/HealthOut' } } } }
  /devices:
    post:
      tags: [Device Service]
      summary: 建立 candidate 裝置（OPS）
      operationId: createDevice
      security: [{ deviceServiceApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceCreate' } } }
      responses:
        '201': { description: 已建立, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceOut' } } } }
        '401': { description: 缺/錯 X-API-Key }
        '403': { description: 通道不允許 }
        '409': { description: 裝置已存在 }
    get:
      tags: [Device Service]
      summary: 列出裝置（OPS；可依 status / stale / type 過濾，支援分頁與排序）
      operationId: listDevices
      security: [{ deviceServiceApiKey: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: stale, in: query, schema: { type: boolean } }
        - { name: type, in: query, schema: { type: string }, description: '依 device_type 過濾' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 }, description: '分頁筆數上限（不給則回全部）' }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [device_id, device_type, status, ai_confidence, created_at, updated_at, last_seen_at], default: device_id }, description: '排序欄位 allowlist；NULLS LAST，次序鍵 device_id' }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200': { description: 裝置清單, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeviceOut' } } } } }
        '422': { description: 參數驗證失敗（如 sort 不在 allowlist）}
  /devices/{device_id}:
    parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Device Service]
      summary: 讀取單一裝置（OPS）
      operationId: getDevice
      security: [{ deviceServiceApiKey: [] }]
      responses:
        '200': { description: 裝置, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceOut' } } } }
        '404': { description: 不存在 }
    patch:
      tags: [Device Service]
      summary: 更新裝置中繼資料（OPS；凍結欄位須走 /override）
      operationId: updateDevice
      security: [{ deviceServiceApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceUpdate' } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceOut' } } } }
        '404': { description: 不存在 }
        '409': { description: 凍結紀錄，請用 /override }
    delete:
      tags: [Device Service]
      summary: 退役裝置（OPS；凍結裝置回 409，改用 /reject）
      operationId: deleteDevice
      security: [{ deviceServiceApiKey: [] }]
      responses:
        '204': { description: 已退役 }
        '404': { description: 不存在 }
        '409': { description: 凍結裝置，請用 /reject }
  /devices/{device_id}/confirm:
    post:
      tags: [Device Service]
      summary: 接受 AI 推論 → confirmed（OPS）
      operationId: confirmDevice
      security: [{ deviceServiceApiKey: [] }]
      parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceOut' } } } }
        '404': { description: 不存在 }
        '409': { description: 非 candidate 狀態 }
  /devices/{device_id}/override:
    post:
      tags: [Device Service]
      summary: 人工修正後接受（OPS；帶 freeze-override token）
      operationId: overrideDevice
      security: [{ deviceServiceApiKey: [] }]
      parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OverrideRequest' } } }
      responses:
        '200': { description: confirmed (manual_override), content: { application/json: { schema: { $ref: '#/components/schemas/DeviceOut' } } } }
        '404': { description: 不存在 }
  /devices/{device_id}/reject:
    post:
      tags: [Device Service]
      summary: 拒絕 → retired（OPS）
      operationId: rejectDevice
      security: [{ deviceServiceApiKey: [] }]
      parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: retired, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceOut' } } } }
        '404': { description: 不存在 }
  /devices/{device_id}/ai-feedback:
    post:
      tags: [Device Service]
      summary: 提交人類修正回饋（OPS，FR-330）
      description: |
        寫入 device_corrections（永久保留，注入後續分類 prompt）。內容違規回 400。
        rerun_classification=true → commit 後觸發 on-demand reclassify（best-effort）。
        demote_to_candidate=true → confirmed→candidate（其他狀態回 409）。
      operationId: createAiFeedback
      security: [{ deviceServiceApiKey: [] }]
      parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionCreate' } } }
      responses:
        '201': { description: 已記錄, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionOut' } } } }
        '400': { description: 內容違規（length/structural/secret/injection/format） }
        '404': { description: 裝置不存在 }
        '409': { description: demote 對非 confirmed 裝置 }
        '429': { description: 速率限制（per-key 30/h、per-device 10/h，FR-343） }
        '503': { description: AUDIT_HASH_SALT 未設（audit identity 不可用） }
  /devices/{device_id}/corrections:
    get:
      tags: [Device Service]
      summary: 列出該裝置歷史 corrections（OPS，內部用）
      operationId: listCorrections
      security: [{ deviceServiceApiKey: [] }]
      parameters:
        - { name: device_id, in: path, required: true, schema: { type: string } }
        - { name: active_only, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: corrections, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CorrectionOut' } } } } }
        '404': { description: 裝置不存在 }
  /devices/{device_id}/corrections/{correction_id}/deactivate:
    post:
      tags: [Device Service]
      summary: 失效一筆 correction（OPS，FR-341；之後不再注入 prompt）
      operationId: deactivateCorrection
      security: [{ deviceServiceApiKey: [] }]
      parameters:
        - { name: device_id, in: path, required: true, schema: { type: string } }
        - { name: correction_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionDeactivateRequest' } } }
      responses:
        '200': { description: 已失效, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionOut' } } } }
        '400': { description: reason 內容違規 }
        '404': { description: 裝置不存在 }
        '409': { description: correction 不存在或已失效 }
  /devices/{device_id}/human-review:
    get:
      tags: [Device Service]
      summary: 讀取人工審查 digest（OPS，§8.4；不現呼 LLM）
      operationId: humanReview
      security: [{ deviceServiceApiKey: [] }]
      parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: digest（llm 或 system_fallback）, content: { application/json: { schema: { $ref: '#/components/schemas/DigestOut' } } } }
        '404': { description: 裝置不存在或尚無 digest }
  /devices/{device_id}/signals:
    parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Device Service]
      summary: 列出裝置 signals（OPS）
      operationId: listSignals
      security: [{ deviceServiceApiKey: [] }]
      responses:
        '200': { description: signals, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SignalOut' } } } } }
    post:
      tags: [Device Service]
      summary: 新增一個 active signal（OPS；凍結裝置須走 /override）
      operationId: addSignal
      security: [{ deviceServiceApiKey: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SignalCreate' } } }
      responses:
        '201': { description: 已新增, content: { application/json: { schema: { $ref: '#/components/schemas/SignalOut' } } } }
        '404': { description: 裝置不存在 }
        '409': { description: signal 已 active，或凍結紀錄（請用 /override） }
  /devices/{device_id}/signals/{signal_name}:
    delete:
      tags: [Device Service]
      summary: 退役一個 active signal（OPS；凍結紀錄須走 /override）
      operationId: deleteSignal
      security: [{ deviceServiceApiKey: [] }]
      parameters:
        - { name: device_id, in: path, required: true, schema: { type: string } }
        - { name: signal_name, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 已退役 }
        '404': { description: 查無 active signal }
        '409': { description: 凍結紀錄，請用 /override }

components:
  parameters:
    SimulatorId:
      name: simulator_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SimulatorIdValue'}
    HistoryDeviceId:
      name: device_id
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
    HistorySince:
      name: since
      in: query
      required: true
      schema: {type: string, format: date-time}
      description: Inclusive start with timezone; total interval at most 7 days
    HistoryUntil:
      name: until
      in: query
      required: true
      schema: {type: string, format: date-time}
      description: Exclusive end with timezone

  securitySchemes:
    simControlToken:
      type: http
      scheme: bearer
      description: Env-only service credential; never provided to browser/CLI.
    bffSession:
      type: apiKey
      in: cookie
      name: ems_bff_session
      description: HttpOnly Secure SameSite Strict opaque session; OPS role required
    basicAuth:
      type: http
      scheme: basic
      description: Grafana admin 帳號密碼 (預設 admin:admin)
    deviceServiceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        device-service 三通道金鑰（FR-310）。OPS 通道用於人工 lifecycle/feedback；
        INGEST 通道供 gateway 寫遙測來源；AI 通道供分類/MCP。金鑰存於 .env
        （OPS_API_KEY / INGEST_API_KEY / AI_API_KEY），缺值該通道 fail-closed。
        AI 金鑰輪替後需 `docker compose up -d device-service-mcp` 重啟（L-3）。

  schemas:
    SimulatorApply: {"type":"object","additionalProperties":false,"required":["request_id","expected_instance_id","expected_revision","changes","reason","deadline"],"properties":{"request_id":{"$ref":"#/components/schemas/SimulatorCommand/properties/request_id"},"expected_instance_id":{"$ref":"#/components/schemas/SimulatorCommand/properties/expected_instance_id"},"expected_revision":{"$ref":"#/components/schemas/SimulatorCommand/properties/expected_revision"},"changes":{"$ref":"#/components/schemas/SimulatorCommand/properties/changes"},"reason":{"$ref":"#/components/schemas/SimulatorCommand/properties/reason"},"deadline":{"type":"number","exclusiveMinimum":0}}}
    SimulatorReceipt: {"type":"object","additionalProperties":false,"required":["request_id","command_hash","changes","before","after"],"properties":{"request_id":{"type":"string","format":"uuid4"},"command_hash":{"type":"string","pattern":"^[a-f0-9]{64}$"},"changes":{"type":"object"},"before":{"$ref":"#/components/schemas/SimulatorSnapshot"},"after":{"$ref":"#/components/schemas/SimulatorSnapshot"}}}
    SimulatorIdValue:
      type: string
      enum: [sim-001, plc-001, sensor-001, delta-sim-001]
    SimulatorCommand:
      type: object
      additionalProperties: false
      required: [request_id, expected_instance_id, expected_revision, changes, reason]
      properties:
        request_id: {type: string, format: uuid4}
        expected_instance_id: {type: string, format: uuid4}
        expected_revision: {type: integer, minimum: 0, maximum: 4096}
        changes:
          description: Non-empty partial settings, matching simulator_id; nulls and unknown keys forbidden.
          oneOf:
            - {$ref: '#/components/schemas/MeterChanges'}
            - {$ref: '#/components/schemas/PLCChanges'}
            - {$ref: '#/components/schemas/SensorChanges'}
            - {$ref: '#/components/schemas/DeltaChanges'}
        reason: {type: string, minLength: 1, maxLength: 200, pattern: '\S'}
    MeterChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        noise_voltage_v: {type: number, minimum: 0, maximum: 20}
        current_base_a: {type: number, minimum: 0, maximum: 1000}
        current_swing_a: {type: number, minimum: 0, maximum: 1000}
        noise_current_a: {type: number, minimum: 0, maximum: 20}
        power_factor: {type: number, minimum: 0, maximum: 1}
        period_seconds: {type: number, minimum: 1, maximum: 86400}
        fault_mode: {type: string, enum: [none, zero, freeze]}
    PLCChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        motor_speed: {type: integer, minimum: 0, maximum: 65535}
        pump_on: {type: boolean}
        valve_open: {type: boolean}
    SensorChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        interval_seconds: {type: integer, enum: [1, 2, 5, 10, 15, 30], description: '2 preserves legacy default; independent of edge poll interval'}
    DeltaChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        scenario: {type: string, enum: [day, night, alarm]}
    SimulatorSnapshot:
      type: object
      required: [simulator_id, instance_id, revision, settings]
      properties:
        simulator_id: {$ref: '#/components/schemas/SimulatorIdValue'}
        instance_id: {type: string, format: uuid4}
        revision: {type: integer, minimum: 0, maximum: 4096}
        settings: {type: object, description: Complete typed configuration for this ID}
    SimulatorDescription:
      type: object
      required: [simulator_id, available, blocked, capabilities]
      properties:
        simulator_id: {$ref: '#/components/schemas/SimulatorIdValue'}
        available: {type: boolean}
        blocked: {type: boolean}
        capabilities: {type: object, description: configure contains JSON Schema for allowed settings}
        instance_id: {type: string, format: uuid4}
        revision: {type: integer, minimum: 0}
        settings: {type: object}
        error: {type: string, enum: [target_unavailable]}
    SimulatorOperation:
      type: object
      required: [sequence, request_id, simulator_id, actor, created_at, status, resolved, reason, changes, expected_instance_id, expected_revision, before, after, error, events]
      properties:
        sequence: {type: integer, minimum: 1}
        request_id: {type: string, format: uuid4}
        simulator_id: {$ref: '#/components/schemas/SimulatorIdValue'}
        actor: {type: string, description: Server-validated login username}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        status: {type: string, enum: [pending, succeeded, failed, outcome_unknown]}
        resolved: {type: boolean, description: 'unknown + true means old instance retired, not proven success'}
        reason: {type: string, minLength: 1, maxLength: 200}
        changes: {type: object}
        expected_instance_id: {type: string, format: uuid4}
        expected_revision: {type: integer, minimum: 0}
        before: {anyOf: [{$ref: '#/components/schemas/SimulatorSnapshot'}, {type: 'null'}]}
        after: {anyOf: [{$ref: '#/components/schemas/SimulatorSnapshot'}, {type: 'null'}]}
        error: {type: [string, 'null']}
        reconciled_by: {type: string}
        reconcile_reason: {type: string}
        observed_instance_id: {type: string, format: uuid4}
        events:
          type: array
          items:
            type: object
            required: [event_id, status, created_at]
            properties:
              event_id: {type: integer}
              status: {type: string, enum: [succeeded, failed, outcome_unknown]}
              created_at: {type: string, format: date-time}
            additionalProperties: true
    DemoAlarmDelivery:
      type: object
      required: [status, event_id, sent_at, channel]
      properties:
        status: {type: string, enum: [sent]}
        event_id: {type: string, format: uuid}
        sent_at: {type: string, format: date-time}
        channel: {type: string, enum: [telegram]}
    DeviceHistory:
      type: object
      required: [device_id, since, until, bucket_seconds, series]
      properties:
        device_id: {type: string}
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        bucket_seconds: {type: integer, minimum: 1, maximum: 10080}
        series:
          type: array
          maxItems: 7200
          items:
            type: object
            required: [time, signal, value, min, max, last, samples, last_time]
            properties:
              time: {type: string, format: date-time, description: Bucket start anchored to since}
              signal:
                type: string
                enum: [voltage, current, power_kw, energy_kwh, temperature, humidity, motor_speed, pressure, pump_on, valve_open]
              value: {type: number, description: Mean of finite samples}
              min: {type: number}
              max: {type: number}
              last: {type: number, description: Latest finite sample in the bucket}
              samples: {type: integer, minimum: 1}
              last_time: {type: string, format: date-time}

    # ===== Device Service (PRD-0003) — 對齊 services/device-service/device_service/models.py =====
    DeviceCreate:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$', example: sim-002 }
        device_type: { type: string, nullable: true, description: 'electricity / temperature / unknown ...' }
        protocol: { type: string, nullable: true, example: modbus_tcp }
        vendor: { type: string, nullable: true }
        model: { type: string, nullable: true }
        location: { type: string, nullable: true }
        gateway_id: { type: string, nullable: true, description: 來源 gateway, example: ems-gateway }
    DeviceUpdate:
      type: object
      description: 非凍結欄位的部分更新；凍結欄位須走 /override。所有欄位皆選填。
      properties:
        device_type: { type: string, nullable: true }
        protocol: { type: string, nullable: true }
        vendor: { type: string, nullable: true }
        model: { type: string, nullable: true }
        location: { type: string, nullable: true }
        gateway_id: { type: string, nullable: true }
    DeviceOut:
      type: object
      required: [device_id, status]
      properties:
        device_id: { type: string }
        device_type: { type: string, nullable: true }
        status: { type: string, description: 'candidate / confirmed / retired' }
        protocol: { type: string, nullable: true }
        vendor: { type: string, nullable: true }
        model: { type: string, nullable: true }
        location: { type: string, nullable: true }
        gateway_id: { type: string, nullable: true }
        classified_by: { type: string, nullable: true, description: 'ai / human / manual_override / migration_backfill' }
        ai_confidence: { type: number, format: float, nullable: true, minimum: 0, maximum: 1, description: 'AI 分類信心值（0–1；未分類為 null）' }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
    SignalCreate:
      type: object
      required: [signal_name]
      properties:
        signal_name: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
        unit: { type: string, nullable: true }
        datatype: { type: string, nullable: true, description: 'float / int / bool / string / enum' }
        direction: { type: string, nullable: true, description: 'read / write / read_write' }
        source_ref: { type: string, nullable: true }
    SignalOut:
      type: object
      required: [id, device_id, signal_name, status]
      properties:
        id: { type: integer }
        device_id: { type: string }
        signal_name: { type: string }
        unit: { type: string, nullable: true }
        datatype: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        status: { type: string, description: 'active / retired' }
    OverrideRequest:
      type: object
      required: [device_type]
      properties:
        device_type: { type: string, description: 人工指定的正確型別（凍結欄位） }
        signals:
          type: array
          default: []
          items: { $ref: '#/components/schemas/SignalCreate' }
          description: 人工指定的 signals（覆寫 AI 推論）
    CorrectionCreate:
      type: object
      required: [verdict, human_explanation]
      properties:
        verdict:
          type: string
          enum: [wrong_classification, wrong_signals, wrong_unit, missed_signal, good_with_note]
        corrected_device_type: { type: string, nullable: true }
        corrected_signals:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/SignalCreate' }
        human_explanation:
          type: string
          description: 人類修正說明；NFKC + 長度(30–500) + 結構/秘密/注入字串檢查（§7.3a），永久保留並注入後續分類 prompt。
        rerun_classification:
          type: boolean
          default: false
          description: commit 後觸發 on-demand reclassify（best-effort，失敗只記 warning）。
        demote_to_candidate:
          type: boolean
          default: false
          description: confirmed→candidate（其他狀態回 409）。
      description: |
        provenance（prompt_version_at_correction、created_by_key_id、salt_version）由伺服端
        stamp，非 client 欄位。
    CorrectionDeactivateRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: 失效理由；同 human_explanation 走 §7.3a 檢查（長度 30–500、結構/秘密/注入）。
    CorrectionOut:
      type: object
      required: [id, device_id, verdict, human_explanation, created_by_key_id, salt_version, applied_count, is_active]
      properties:
        id: { type: integer }
        device_id: { type: string }
        verdict: { type: string }
        corrected_device_type: { type: string, nullable: true }
        corrected_signals:
          type: array
          nullable: true
          items: { type: object, additionalProperties: true }
        human_explanation: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        created_by_key_id: { type: string, description: HMAC key id（非原始金鑰） }
        salt_version: { type: string }
        prompt_version_at_correction: { type: string, nullable: true }
        applied_count: { type: integer }
        last_applied_at: { type: string, format: date-time, nullable: true }
        is_active: { type: boolean }
        deactivated_at: { type: string, format: date-time, nullable: true }
        deactivation_reason: { type: string, nullable: true }
    DigestOut:
      type: object
      required: [device_id, digest, summary_source]
      description: 人工審查 digest（§8.4）；不現呼 LLM，讀既有快取。
      properties:
        device_id: { type: string }
        digest: { type: object, additionalProperties: true, description: digest.py 建的固定形狀 JSON }
        summary_source: { type: string, description: 'llm / system_fallback' }
        generated_at: { type: string, format: date-time, nullable: true }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        prompt_version: { type: string, nullable: true }
    HealthOut:
      type: object
      required: [status, pools]
      description: device-service /healthz（FR-314）；degraded 時回 503。
      properties:
        status: { type: string, description: 'ok / degraded' }
        pools:
          type: object
          additionalProperties: { type: string }
          description: 各 DB pool 狀態（ai / ops → ok|...）

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: 服務狀態

    SimulatorConfig:
      type: object
      properties:
        noise_voltage_v:
          type: number
          format: float
          description: 電壓雜訊標準差 (V)
          example: 3.0
        current_base_a:
          type: number
          format: float
          description: 基礎電流 (A)
          example: 100.0
        current_swing_a:
          type: number
          format: float
          description: 電流波動幅度 (A)
          example: 40.0
        noise_current_a:
          type: number
          format: float
          description: 電流雜訊標準差 (A)
          example: 2.0
        power_factor:
          type: number
          format: float
          description: 功率因數
          minimum: 0
          maximum: 1
          example: 0.85
        period_seconds:
          type: number
          format: float
          description: 負載週期秒數
          example: 3600.0
        fault_mode:
          type: string
          enum:
            - none
            - zero
            - freeze
          description: 目前的故障模式

    FaultResponse:
      type: object
