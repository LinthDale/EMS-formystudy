x-delta-edge-v2-reliable-subset:
  status: implemented-private-verified
  deployment: Explicit opt-in only; existing shared v1 and active 24h run not switched
  adr: doc/adr/ADR-043-opt-in-committed-telemetry.md
  evidence: output/committed-delivery-fix-20261112/README.md
  source: services/delta/delta_device/reliable_wire.py
  receiver: services/edge-receiver/edge_receiver/receiver.py
  schema_migration: infra/timescaledb/migrations/019_edge_committed_receipts.sql
  sender_batch_samples: 1
  sender_inflight_batches: 1
  sender_max_batches_per_second: 2
  sender_selection: Alternate newest and oldest pending capture_seq after each authenticated committed ACK that resolves an existing local sample; start with newest; failed/retryable/retired ACK does not consume the turn
  sender_selection_adr: doc/adr/ADR-048-v2-live-backlog-fairness.md
  sender_selection_limit: In-memory turn resets on process restart; newest candidate is not a fixed latency SLA for every sample; wire2/local schema3 unchanged
  receiver_max_batch_samples: 32
  receiver_max_wire_bytes: 65536
  receiver_samples_per_second: 40
  receiver_sample_burst: 64
  session_max_bytes: 1024
  recovery_generation: Required external UUID file; rotate before PITR and force new gateway sessions
  canonicalization: Sorted-key ASCII-escaped UTF-8 JSON, no whitespace; measurements normalized to float and negative zero to 0.0; SHA256 excludes payload_hash
  sample_required: [sample_id, gateway_id, device_id, stream_id, capture_seq, window_id, config_revision, sampled_at_us, profile_version, time_quality, measurements, payload_hash]
  sample_unknown_fields: reject
  sample_max_bytes: 1024
  sample_uuid_fields: [sample_id, stream_id, window_id]
  sample_identities: ASCII alnum/underscore/hyphen, 1-64 chars; authoritative gateway/device/stream/revision/profile and effective half-open time range
  capture_seq: Positive int64; boolean rejected; persisted with sample and local sequence
  sampled_at_us: Positive int64 source UTC microseconds; DB accepts now minus 90 days through now plus 120 seconds
  time_quality: trusted
  measurements:
    required: [voltage, current, power_kw, energy_kwh]
    unknown_fields: reject
    numbers: Finite 0..1e15; booleans and oversized integers rejected before float conversion
    projection: L1 voltage/current, total three-phase kW, lifetime kWh
  sample_envelope_required: [schema_version, gateway_id, session_challenge, recovery_generation, batch_id, samples]
  session_request_required: [schema_version, gateway_id, session_challenge]
  session_response_required: [schema_version, gateway_id, session_challenge, recovery_generation]
  ack_envelope_required: [schema_version, gateway_id, session_challenge, recovery_generation, batch_id, results]
  ack_result:
    required: [sample_id, payload_hash, status]
    status: [committed, retryable, rejected]
    committed_requires: committed_at with UTC offset; DB transaction COMMIT returned; field additionally requires fixed post-COMMIT LSN covered by named synchronous durable WAL peer (ADR-049)
    non_committed_requires: error_code
    error_code: [conflict, invalid, unauthorized, outside_window, database, rate]
  ack_acceptance: Current authenticated topic/gateway/session/generation/batch and exact pending ID/hash; entire result validated under same lock as reconnect and deletion; retained/unknown/duplicate ignored
  persistence: SQLite DELETE/EXTRA; PostgreSQL fsync=on and synchronous_commit=on; receipt and projection in same READ COMMITTED transaction
  idempotency: Receipt unique gateway/sample and gateway/device/stream/sequence; row-lock recheck of indexed measurement identity, 0 repair, 1 exact match, more than 1 conflict
  field_authentication: Mandatory verified mTLS, certificate CN bound to gateway_id, server-only ACK/session responses; no anonymous listener sharing v2 topic plane
  demo: Explicit matching network-none namespace with lo only; shared anonymous broker refused
  local_schema_version: 3
  wire_schema_version: 2
  retention_adr: doc/adr/ADR-045-newest-first-edge-retention.md
  retention: Local queue/quarantine/audit/byte pressure retires oldest capture-sequence prefix to admit newest sample; retirement and new sample commit atomically or all roll back. Retirement is not central committed ACK. Central receipts are not automatically purged.
  retirement_observability: Bounded local cumulative counters and latest sequence span with last ID/hash, plus capacity_eviction warning; no central gap UI or complete per-sample retirement ledger
  local_sampled_ns: Microsecond-aligned non-negative int64, validated before retirement; wire microsecond contract unchanged
  not_implemented: [multi-device-scheduler, sealed-manifest-reconciliation, daily-reconciliation, heartbeat-ui, central-receipt-retention, remote-sampling-config, Pi-field-validation]

x-delta-demo-sampling:
