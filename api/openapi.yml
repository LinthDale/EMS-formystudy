# 2026-09-23: Local EMS design preview reuses existing auth, devices and measurements routes.
# No API contract change. See output/ems-design-preview-20260923/README.md.

# PRD-0020: non-HTTP contract extension; existing REST schemas are unchanged.
x-delta-telemetry:
  profile: delta-three-phase-v1.35
  simulator:
    transports: [tcp, rtu]
    default_transport: tcp
    rtu:
      role: slave-server
      port: Operator-specified local COMn or /dev/ device; serial URLs rejected
      baudrates: [9600, 19200, 38400]
      framing: 8N1
      unit_id: Single station, 1-247
      function_codes: [4]
      unknown_unit_and_broadcast: ignore
      startup_failure: nonzero-exit
      tcp_listener: false
      validation: Linux PTY verified; physical RS485 and Windows COM pending
  topic: ems/devices/{device_id}/measurements
  format: influx-line-protocol
  measurement: electricity_measurements
  qos: 1
  retain: false
  timestamp: source-utc-nanoseconds-microsecond-aligned
  fields:
    voltage: L1 phase voltage in V
    current: L1 current in A
    power_kw: Three-phase total active output in kW
    energy_kwh: Lifetime generation in kWh, low-word-first source
  delivery: Broker PUBACK only; DB loss and replay duplicates remain possible

# Proposed non-HTTP contract only; not an implemented endpoint or active broker route.
x-planned-delta-edge-v2:
  status: draft-not-implemented
  prd: doc/prd/PRD-0021-multi-device-edge-reliability.md
  adr: doc/adr/ADR-030-edge-durable-receipts.md
  transport: MQTT-over-TLS
  topics:
    samples: ems/v2/gateways/{gateway_id}/samples
    acks: ems/v2/gateways/{gateway_id}/acks
    session_request: ems/v2/gateways/{gateway_id}/session/request
    session_response: ems/v2/gateways/{gateway_id}/session/response
    reconcile_request: ems/v2/gateways/{gateway_id}/reconcile/request
    reconcile_response: ems/v2/gateways/{gateway_id}/reconcile/response
    health: ems/v2/gateways/{gateway_id}/health
  qos: 1
  retain: false
  identity: Per-gateway mTLS and topic/device ownership validation
  delivery: Delete local row only after validated central DB committed ACK
  idempotency: Unique gateway_id/sample_id with immutable canonical payload hash
  limits:
    sample_bytes: 1024
    batch_samples: 32
    batch_bytes: 65536
    inflight_batches: 8
    receiver_samples_per_second: 40
  payload_schema: Draft fields and validation in PRD-0021 section 8; implementation pending
  reconciliation:
    status: draft-not-implemented
    contract: PRD-0021 sections 8.1 and 15.1
    audit_interval_seconds: 300
    audit_history_days: 7
    max_page_entries: 256
    max_message_bytes: 65536
    heartbeat_interval_seconds: 30
    gateway_unavailable_after_seconds: 90
    reconciliation_reply_deletes_queue: false
  sampling:
    status: draft-not-implemented
    contract: PRD-0021 FR-2117/2118 and section 15.2
    scope: per-device
    presets_seconds: [1, 5, 10, 15, 30]
    default_seconds: 10
    mixed_intervals: true
    desired_state: requested_interval_s
    applied_state: effective_interval_s
    activation: Gateway validated durable config_revision and applied boundary
    admission: Model and bus schedulability plus pending/audit disk and uplink capacity
    ui_refresh_equals_sampling: false
    baseline: Eight devices at 10 seconds with seven days offline
    remote_config_transport: Not implemented; no new configuration route declared
  existing_v1_unchanged: true

x-delta-demo-sampling:
  adr: ADR-034
  device_id: delta-sim-001
  demo_interval_seconds: 1
  field_default_interval_seconds: 10
  schedule: monotonic deadlines; skip missed slots without synthetic samples
  noise_enable_env: DELTA_SIM_NOISE=1
  phase_voltage_noise: {sigma_v: 1.5, maximum_absolute_v: 4.5}
  phase_current_noise: {sigma_a: 0.15, maximum_absolute_a: 0.45}
  power: sum of phase voltage times phase current; unity power factor
  energy: integral of baseline generation; no random counter noise
  contract_change: none; existing REST, MQTT and measurement fields preserved
