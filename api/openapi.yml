          description: 電流 (A)
          example: 105.3
        power_kw:
          type: number
          format: float
          description: 功率 (kW)
          example: 58.7
        energy_kwh:
          type: number
          format: float
          description: 累計電量 (kWh)
          example: 1234.56

    FactoryMeasurement:
      type: object
      required:
        - time
        - device_id
      properties:
        time:
          type: string
          format: date-time
          description: 量測時間 (UTC)
          example: "2026-04-27T09:00:00Z"
