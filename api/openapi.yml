            - freeze
          description: 已設定的故障模式

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 錯誤訊息

    Measurement:
      type: object
      required:
        - time
        - device_id
      properties:
        time:
          type: string
          format: date-time
