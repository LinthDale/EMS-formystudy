# =============================================================================
# EMS 前端 production nginx（PRD-0005 §9.5 [必過] + security review M-1）
# =============================================================================
# 角色：在 prod 同源服務靜態 SPA bundle，並注入 §9.5 安全標頭；同源 reverse-proxy
#       /api → BFF（ems-bff:8003）。同源（瀏覽器只看到 nginx 這一個 origin）是
#       關鍵——這樣 mutating /api 請求的瀏覽器 Origin 會等於 nginx 對外 origin，
#       命中 BFF 的 CSRF Origin 白名單（§9.4 [必過]），CSRF 才會通過。
#
# 分層責任（與 services/bff/bff/security.py 註解一致，避免雙層打架）：
#   - 本檔（nginx）：負責「SPA HTML / 靜態資產」的完整 §9.5 標頭，含 HSTS 與
#     為 SPA 調校過的 CSP（self-hosted 字體/樣式/ECharts；script 不開 unsafe-inline）。
#   - BFF：負責「/api JSON 回應」自己那組緊縮標頭（default-src 'none'）。本檔
#     『不』對 /api location 疊加 add_header，讓 BFF 的 API CSP 原樣穿透，不被覆寫。
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 靜態 build 根目錄（Dockerfile 將 dist/ 複製到此）
    root /usr/share/nginx/html;
    index index.html;

    # 隱藏 nginx 版本（少給攻擊者情報）
    server_tokens off;

    # ── gzip（壓縮文字資產；woff2 已是壓縮格式故不重壓）──────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # =========================================================================
    # §9.5 [必過] 安全標頭 —— 定義成可重用片段，套在「會回給瀏覽器當文件」的
    # location（HTML/靜態），『不』套在 /api（交給 BFF）。
    #
    # CSP 選型理由（security review）：
    #   default-src 'none'           — deny-by-default，未明列者一律擋。
    #   script-src 'self'            — 只跑同源 bundle；【刻意不開 unsafe-inline】。
    #                                  Vite build 的 index.html 為純外部 <script src>，
    #                                  無 inline script，故 'self' 足夠且最安全
    #                                  （堵 §9.5 XSS / digest 注入的腳本執行面）。
    #   style-src 'self' 'unsafe-inline'
    #                                — 樣式才放 unsafe-inline：ECharts 在執行期對
    #                                  其容器/canvas 寫 inline style、React 亦會寫
    #                                  style 屬性；inline 樣式風險遠低於 inline 腳本。
    #                                  (Tailwind 產出的是 self 的 <link> css，本身不需此。)
    #   font-src 'self'              — 字體全自託管（@fontsource woff2/woff），離線。
    #   img-src 'self' data:         — icon / ECharts 可能用 data: URI。
    #   connect-src 'self'           — fetch/XHR 只打同源 /api（BFF 同源代理）。
    #   frame-ancestors 'none'       — 防 clickjacking（呼應 X-Frame-Options: DENY，
    #                                  保護 FR-512 人工確認按鈕被點劫）。
    #   base-uri 'self' / form-action 'self' / object-src 'none' — 收束注入面。
    # 註：無任何外部 origin（字體/圖表/腳本皆自託管）→ 全離線、零第三方連線面。
    # =========================================================================

    # SPA history fallback：未命中實體檔的路由一律回 index.html（前端路由接手）
    location / {
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # 帶 hash 的不可變資產（assets/*）：長快取；HTML 本身不快取（見上方 location /，
    # index.html 由 try_files 命中，沿用 location / 的標頭，不另設長快取）。
    location /assets/ {
        # 單一 Cache-Control（不用 expires 以免疊出第二個 Cache-Control 標頭）
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # 靜態資產同樣掛上安全標頭（即使非 HTML，nosniff/HSTS 仍有意義）
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # ── 同源 reverse-proxy：/api → BFF（§9.3 瀏覽器零直連、零 CORS 面）──────────
    # 不重寫前綴：BFF 自己掛在 /api 之下並對 /api mutating 路由驗 Origin。
    # 不疊加 add_header：讓 BFF 的 API CSP（default-src 'none'）原樣回傳。
    #
    # 用『變數 + resolver』寫 proxy_pass：強制 nginx 在「請求時」才解析 BFF DNS，
    # 而非啟動時——這樣即使 nginx 比 bff 早起（或 bff 暫時重啟），nginx 也不會
    # 因為 "host not found in upstream" 而開不起來（compose 啟動順序韌性）。
    # 127.0.0.11 是 Docker compose 內建 DNS；ems-bff 為 bff service 的 container_name。
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $bff_upstream "http://ems-bff:8003";
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 同源轉發：保留瀏覽器原始 Origin，BFF CSRF Origin 白名單才比對得到
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_headers on;
    }

    # 健康檢查（compose / orchestrator 探活用；不掛安全標頭、不進 SPA fallback）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
