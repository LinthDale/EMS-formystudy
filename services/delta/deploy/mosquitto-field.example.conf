# TEMPLATE ONLY. Install on a dedicated field broker; do not replace demo config.
listener 8883
protocol mqtt
allow_anonymous false
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2
password_file /etc/mosquitto/passwords
acl_file /etc/mosquitto/acl
persistence true
persistence_location /var/lib/mosquitto/
# Username must equal device_id. Secure ingestion subscriber needs its own ACL.
# ACL file:
# pattern write ems/devices/%u/measurements
# user ems-ingest
# topic read ems/devices/+/measurements
# IMPORTANT: ACL binds topic only; receiver-side device_id binding remains a field gate.
